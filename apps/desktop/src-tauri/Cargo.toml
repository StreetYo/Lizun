[package]
name = "lizun"
version = "0.1.0"
description = "Lizun: open-source dynamic island with installable widgets"
authors = ["Lizun contributors"]
license = "MIT OR Apache-2.0"
edition = "2024"
rust-version = "1.90"

[lib]
name = "lizun_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
base64 = "0.22"
percent-encoding = "2"
tungstenite = "0.30"
tauri-plugin-drag = "2"
tauri-plugin-autostart = "2"
ureq = { version = "3", default-features = false, features = ["native-tls"] }
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tauri-plugin-dialog = "2"
chrono = "0.4"
chrono-tz = "0.10"
rrule = "0.14"
png = "0.18"

[target.'cfg(windows)'.dependencies]
windows-future = "0.3"
windows = { version = "0.62.2", features = [
  "Foundation",
  "Media_Control",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_System_Time",
  "Win32_UI_Accessibility",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
